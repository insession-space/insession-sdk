<!-- @insession SDK のファビコン。
     「同じ部屋に居る複数人」を3つの点で表す。色は @insession/design-system の
     accent(#ff6a47) / accent-2(#618ff1) / decor-1(#31c47e)。
     16px でも潰れないよう、点は3つまで・輪郭線は細くしすぎない。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="@insession SDK">
  <rect width="32" height="32" rx="8" fill="#121211" />
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#403a2d" stroke-width="1.5" />
  <circle cx="16" cy="9.5" r="3.4" fill="#ff6a47" />
  <circle cx="10.4" cy="19.2" r="3.4" fill="#618ff1" />
  <circle cx="21.6" cy="19.2" r="3.4" fill="#31c47e" />
</svg>
